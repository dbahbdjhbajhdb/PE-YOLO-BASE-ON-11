# YOLO11-DAU (Ablation: remove CA & CBAM-S, reindex layers)

nc: 10
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, RFAConv, [64, 3, 2]] # 0  (↓2)
  - [-1, 1, RFAConv, [128, 3, 1]] # 1  (保持分辨率)
  - [-1, 1, SPDConv, [256, 3, 1]] # 2  (↓2) => 等价于原来这一阶段的下采样
  - [-1, 2, C3k2, [256, False, 0.25]] # 3

  - [-1, 1, RFAConv, [256, 3, 1]] # 4  (保持分辨率)
  - [-1, 1, SPDConv, [512, 3, 1]] # 5  (↓2)
  - [-1, 2, C3k2, [512, False, 0.25]] # 6

  - [-1, 1, RFAConv, [512, 3, 1]] # 7  (保持分辨率)
  - [-1, 1, SPDConv, [512, 3, 1]] # 8  (↓2)
  - [-1, 2, C3k2, [512, True]] # 9

  - [-1, 1, RFAConv, [1024, 3, 1]] # 10 (保持分辨率)
  - [-1, 1, SPDConv, [1024, 3, 1]] # 11 (↓2)
  - [-1, 2, C3k2, [1024, True]] # 12

  - [-1, 1, SPPF, [1024, 5]] # 13
  - [-1, 2, C2PSA, [1024]] # 14

head:
  # top-down layer3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 9], 1, Concat, [1]] # 16
  - [-1, 2, C3k2, [512, False]] # 17

  # top-down layer2
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 18
  - [[-1, 6], 1, Concat, [1]] # 19
  - [-1, 2, C3k2, [256, False]] # 20

  # top-down layer1
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 21
  - [[-1, 3], 1, Concat, [1]] # 22
  - [-1, 2, C3k2, [128, False]] # 23
  - [-1, 1, DynamicAttention, []] # 24: 动态注意力模块用于浅层特征增强# P2

  # Bottom-up layer1
  - [23, 1, Conv, [128, 3, 2]] # 25
  - [[-1, 20], 1, Concat, [1]] # 26
  - [-1, 2, C3k2, [256, False]] # 27  # P3

  # Bottom-up layer2
  - [-1, 1, Conv, [256, 3, 2]] # 28: P3 -> P3
  - [[-1, 17], 1, Concat, [1]] # 29
  - [-1, 2, C3k2, [512, False]] # 30  # P4

  # Detect heads (P2, P3, P4)
  - [[24, 27, 30], 1, Detect, [nc]] # 31
