# YOLO11-DAU (Ablation: remove CA & CBAM-S, reindex layers)

nc: 10
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, ESSamp, [3, 64]] # 0
  - [-1, 1, ESSamp, [64, 128]] # 1
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, RFAConv, [256, 3, 2]] # 3
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, RFAConv, [512, 3, 2]] # 5
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, RFAConv, [1024, 3, 2]] # 7
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13 (p4/16)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 2, C3k2, [128, False]] # 19 (P2/4-small)

  # 第二轮

  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, True]] # 21 p3/8

  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # /4
  - [[2, 19], 1, Concat, [1]]
  - [[-1, 24], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]] # 27 (P2/4)

  # 第三轮

  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False]] # 30 p4 /16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # /8
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]] # 33 p3 /8

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 34 /4
  - [[2, 27], 1, Concat, [1]] #动
  - [[-1, 34], 1, Concat, [1]] #动
  - [-1, 2, C3k2, [128, False]] # 37 (P2/4-small)

  - [[37, 33, 30], 1, Detect, [nc]] # Detect(P2, P3, P4) 动
