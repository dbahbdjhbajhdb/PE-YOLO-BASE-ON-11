nc: 10
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, RFAConv, [64, 3, 2]]        # 0: Stem (P1/2)
  - [-1, 1, RFAConv, [128, 3, 2]]       # 1: P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, RFAConv, [256, 3, 2]]       # 3: P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4
  - [-1, 1, RFAConv, [512, 3, 2]]       # 5: P4/16
  - [-1, 2, C3k2, [512, True]]          # 6
  - [-1, 1, RFAConv, [1024, 3, 2]]      # 7: P5/32
  - [-1, 2, C3k2, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5]]            # 9
  - [-1, 2, C2PSA, [1024]]              # 10

head:
  # ---------------- Path P5 (Base) ----------------
  - [10, 1, Conv, [512, 1, 1]] # 11: 1x1 Conv (通道对齐)
  - [-1, 1, Conv, [512, 3, 1]] # 12: 3x3 Conv -> [Head P5 Source] & [Deep Input for P4]

  # ---------------- Path P4 ----------------
  # Lateral Input from Backbone P4 (idx 6)
  - [6, 1, Conv, [512, 1, 1]]  # 13: 1x1 Conv

  # SDC Fusion
  # Inputs: [Deep(12), Current(13)]
  # Args: [] -> 留空, tasks.py 会自动计算 c2 = 512 // 2 = 256
  - [[12, 13], 1, SDC_Selective_Fusion, []] # 14: Output=256

  # Post Process
  - [-1, 1, Conv, [256, 3, 1]] # 15: 3x3 Conv -> [Head P4 Source] & [Deep Input for P3]

  # ---------------- Path P3 ----------------
  # Lateral Input from Backbone P3 (idx 4)
  - [4, 1, Conv, [256, 1, 1]]  # 16: 1x1 Conv

  # SDC Fusion
  # Inputs: [Deep(15), Current(16)]
  # Args: [] -> 留空, tasks.py 会自动计算 c2 = 256 // 2 = 128
  - [[15, 16], 1, SDC_Selective_Fusion, []] # 17: Output=128

  # Post Process
  - [-1, 1, Conv, [128, 3, 1]] # 18: 3x3 Conv -> [Head P3 Source] & [Deep Input for P2]

  # ---------------- Path P2 (Small Object Focus) ----------------
  # Lateral Input from Backbone P2 (idx 2)
  - [2, 1, Conv, [128, 1, 1]]  # 19: 1x1 Conv

  # SDC Fusion
  # Inputs: [Deep(18), Current(19)]
  # Args: [] -> 留空, tasks.py 会自动计算 c2 = 128 // 2 = 64
  - [[18, 19], 1, SDC_Selective_Fusion, []] # 20: Output=64

  # Post Process
  - [-1, 1, Conv, [64, 3, 1]]  # 21: 3x3 Conv -> [Head P2 Source]

  # =============================================================================
  # Head (检测头)
  # 4个输出头: P2(Small), P3(Medium), P4(Large), P5(X-Large)
  # =============================================================================
  - [[12, 15, 18, 21], 1, Detect_CFDH, [nc]] # Detect