# YOLO11-DAU-Custom-V2
# Strictly based on image_c8d5d2.png
# Changes:
# 1. Added Conv1x1_Equal at P2 (Yellow Box).
# 2. Routing Green Dashed Lines: Bottom-up concats now take 3 inputs.

nc: 10 # 修改为你的类别数
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, RFAConv, [64, 3, 2]] # 0: P1/2
  - [-1, 1, RFAConv, [128, 3, 2]] # 1: P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2: Backbone P2 (Source for P2 1x1)
  - [-1, 1, RFAConv, [256, 3, 2]] # 3: P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4: Backbone P3 (Source for P3 1x1)
  - [-1, 1, RFAConv, [512, 3, 2]] # 5: P4/16
  - [-1, 2, C3k2, [512, True]] # 6: Backbone P4 (Source for P4 1x1)
  - [-1, 1, RFAConv, [1024, 3, 2]] # 7: P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10: Backbone End

head:
  # ============ Top-Down Layer 3 (P5 -> P4) ============
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11: Upsample P5

  # [黄色框 P4]
  - [6, 1, Conv1x1_Equal, []] # 12: 1x1 Conv on Backbone P4 (用于后续绿色虚线连接)

  - [[-1, 11], 1, Concat, [1]] # 13: Concat (1x1_P4 + Upsampled_P5)
  - [-1, 2, C3k2, [512, False]] # 14: Neck P4 Output

  # ============ Top-Down Layer 2 (P4 -> P3) ============
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15: Upsample Neck P4

  # [黄色框 P3]
  - [4, 1, Conv1x1_Equal, []] # 16: 1x1 Conv on Backbone P3 (用于后续绿色虚线连接)

  - [[-1, 15], 1, Concat, [1]] # 17: Concat (1x1_P3 + Upsampled_P4)
  - [-1, 2, C3k2, [256, False]] # 18: Neck P3 Output

  # ============ Top-Down Layer 1 (P3 -> P2) ============
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 19: Upsample Neck P3

  # [新增: 黄色框 P2] (这里是你要求的修改点)
  - [2, 1, Conv1x1_Equal, []] # 20: 1x1 Conv on Backbone P2

  - [[-1, 19], 1, Concat, [1]] # 21: Concat (1x1_P2 + Upsampled_P3)
  - [-1, 2, C3k2, [128, False]] # 22: Neck P2 Output

  # ============ P2 Head Branch (Green Box) ============
  # [绿色框 Attention]
  - [22, 1, VGASBlock, []] # 23: P2 Output (To Detect)

  # ============ Bottom-Up Layer 1 (P2 -> P3) ============
  - [22, 1, Conv, [128, 3, 2]] # 24: Downsample P2

  # Concat 三路输入:
  # 1. 当前层 (-1, 即 P2下采样)
  # 2. Neck P3 (18)
  # 3. Backbone P3 1x1 (16) <--- 对应图中绿色虚线
  - [[-1, 16, 18], 1, Concat, [1]] # 25: 3-Way Concat

  - [-1, 2, C3k2, [256, False]] # 26: P3 Output (To Detect)

  # ============ Bottom-Up Layer 2 (P3 -> P4) ============
  - [-1, 1, Conv, [256, 3, 2]] # 27: Downsample P3

  # Concat 三路输入:
  # 1. 当前层 (-1, 即 P3下采样)
  # 2. Neck P4 (14)
  # 3. Backbone P4 1x1 (12) <--- 对应图中绿色虚线
  - [[-1, 12, 14], 1, Concat, [1]] # 28: 3-Way Concat

  - [-1, 2, C3k2, [512, False]] # 29: P4 Output (To Detect)

  # ============ Detect Head ============
  - [[23, 26, 29], 1, CE_Head, [nc]] # 30: Detect Inputs [P2_Attn, P3, P4]
